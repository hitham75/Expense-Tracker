<div class="chatbot-wrapper position-fixed bottom-0 end-0 m-4 z-3">
  @if (!isOpen) {
    <button 
      (click)="toggleChat()" 
      class="btn btn-purple-gradient text-white rounded-circle shadow-lg p-3 d-flex align-items-center justify-content-center chat-toggle-btn">
      <i class="bi bi-chat-dots-fill fs-3"></i>
    </button>
  } @else {
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden chat-card">
      <!-- Header -->
      <div class="card-header bg-purple-gradient text-white p-3 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
          <div class="bg-white text-purple rounded-circle p-1 px-2 fw-bold">
            <i class="bi bi-robot fs-5"></i>
          </div>
          <div>
            <h6 class="mb-0 fw-bold">Expense Assistant</h6>
            <small class="text-white-50 opacity-75" style="font-size: 0.75rem;">AI Powered</small>
          </div>
        </div>
        <button (click)="toggleChat()" class="btn-close btn-close-white shadow-none"></button>
      </div>

      <!-- Messages Body -->
      <div class="card-body p-3 chat-body bg-light">
        @for (msg of messages; track $index) {
          <div class="d-flex mb-3" [ngClass]="{'justify-content-end': msg.isUser, 'justify-content-start': !msg.isUser}">
            <div 
              class="p-3 rounded-4 max-w-75 shadow-sm"
              [ngClass]="{
                'bg-purple-gradient text-white rounded-bottom-end-0': msg.isUser,
                'bg-white text-dark border border-purple-subtle rounded-bottom-start-0': !msg.isUser
              }">
              <p class="mb-0 fs-7" dir="auto">{{ msg.text }}</p>
            </div>
          </div>
        }

        <!-- Typing Animation Indicator -->
        @if (isTyping) {
          <div class="d-flex justify-content-start mb-3">
            <div class="bg-white border border-purple-subtle p-3 rounded-4 rounded-bottom-start-0 shadow-sm d-flex align-items-center gap-1">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </div>
          </div>
        }
      </div>

      <!-- Footer Input -->
      <div class="card-footer bg-white p-2 border-top-0">
        <form (ngSubmit)="sendMessage()" class="input-group">
          <input 
            type="text" 
            class="form-control border-purple-subtle rounded-pill-start shadow-none" 
            placeholder="Ask a question..." 
            [(ngModel)]="userInput" 
            name="userInput"
            [disabled]="isTyping"
            required
          />
          <button type="submit" class="btn btn-purple-gradient text-white rounded-pill-end px-3" [disabled]="isTyping">
            <i class="bi bi-send-fill"></i>
          </button>
        </form>
      </div>
    </div>
  }
</div>
