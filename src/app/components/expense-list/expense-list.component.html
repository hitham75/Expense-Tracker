<div class="container my-4">
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <input
        type="text"
        class="form-control"
        placeholder="Search by note..."
        [ngModel]="searchTerm()"
        (ngModelChange)="searchTerm.set($event)"
      />
    </div>
    <div class="col-md-4">
      <select
        class="form-select"
        [ngModel]="selectedCategory()"
        (ngModelChange)="selectedCategory.set($event)"
      >
        <option value="">All Categories</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Utilities">Utilities</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle border">
      <thead class="table-light">
        <tr>
          <th>Category</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Note</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of paginatedExpenses()">
          <td>{{ item.category }}</td>
          <td>{{ item.amount | currency }}</td>
          <td>{{ item.date | date : 'mediumDate' }}</td>
          <td>{{ item.note }}</td>
          <td>
            <div class="d-flex gap-2">
              <a [routerLink]="['/edit-expense', item.id]" class="btn btn-sm btn-outline-primary">
                Edit
              </a>
              <button (click)="deleteExpense(item.id)" class="btn btn-sm btn-danger">
                Delete
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="paginatedExpenses().length === 0">
          <td colspan="5" class="text-center text-muted py-3">
            No expenses found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3" *ngIf="totalPages() > 1">
    <button
      class="btn btn-sm btn-outline-secondary"
      (click)="prevPage()"
      [disabled]="currentPage() === 1"
    >
      Previous
    </button>
    <span>Page {{ currentPage() }} of {{ totalPages() }}</span>
    <button
      class="btn btn-sm btn-outline-secondary"
      (click)="nextPage()"
      [disabled]="currentPage() === totalPages()"
    >
      Next
    </button>
  </div>
</div>
