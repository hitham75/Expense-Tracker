<div class="container py-5 d-flex justify-content-center">
  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white style-card">
    <!-- Header -->
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="icon-box bg-purple-subtle text-purple rounded-circle p-3 d-flex align-items-center justify-content-center">
        <i class="bi" [ngClass]="isEditMode ? 'bi-pencil-square fs-3' : 'bi-plus-circle-fill fs-3'"></i>
      </div>
      <div>
        <h3 class="fw-bold text-purple mb-0">
          {{ isEditMode ? 'Edit Expense' : 'Add New Expense' }}
        </h3>
        <p class="text-muted small mb-0">Enter the details below to log your expense</p>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()">
      <!-- Title -->
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary">Title</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted">
            <i class="bi bi-tag"></i>
          </span>
          <input 
            type="text" 
            class="form-control bg-light border-start-0 rounded-end-3 py-2 shadow-none" 
            placeholder="e.g. Grocery Shopping"
            [(ngModel)]="expenseData.title" 
            name="title" 
            required 
          />
        </div>
      </div>

      <!-- Category -->
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary">Category</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted">
            <i class="bi bi-grid"></i>
          </span>
          <select 
            class="form-select bg-light border-start-0 rounded-end-3 py-2 shadow-none" 
            [(ngModel)]="expenseData.category" 
            name="category" 
            required>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Bills">💡 Bills</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>
      </div>

      <!-- Amount -->
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary">Amount ($)</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted">
            <i class="bi bi-currency-dollar"></i>
          </span>
          <input 
            type="number" 
            step="0.01" 
            class="form-control bg-light border-start-0 rounded-end-3 py-2 shadow-none" 
            placeholder="0.00"
            [(ngModel)]="expenseData.amount" 
            name="amount" 
            required 
          />
        </div>
      </div>

      <!-- Date -->
      <div class="mb-4">
        <label class="form-label fw-semibold text-secondary">Date</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted">
            <i class="bi bi-calendar-event"></i>
          </span>
          <input 
            type="date" 
            class="form-control bg-light border-start-0 rounded-end-3 py-2 shadow-none" 
            [(ngModel)]="expenseData.date" 
            name="date" 
            required 
          />
        </div>
      </div>

      <!-- Actions -->
      <div class="d-flex justify-content-end gap-2 pt-2">
        <a routerLink="/expenses" class="btn btn-light rounded-pill px-4 py-2 fw-semibold text-secondary">
          Cancel
        </a>
        <button type="submit" class="btn btn-purple-gradient text-white rounded-pill px-4 py-2 fw-semibold shadow-sm">
          {{ isEditMode ? 'Update Expense' : 'Save Expense' }}
        </button>
      </div>
    </form>
  </div>
</div>
